<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.home1"/>
    <allow send_destination="org.freedesktop.home1"/>
    <allow receive_sender="org.freedesktop.home1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.DBus.Peer" send_member="GetMachineId"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.home1.Manager" send_member="GetHomeByName"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.home1.Manager" send_member="GetHomeByUID"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.home1.Manager" send_member="GetUserRecordByUID"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.home1.Manager" send_member="GetUserRecordByName"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.home1.Manager" send_member="GetUserRecordByPID"/>
    <allow send_destination="org.freedesktop.home1" send_interface="org.freedesktop.home1.Manager" send_member="ListHomes"/>
    <allow receive_sender="org.freedesktop.home1"/>
  </policy>
</busconfig>
